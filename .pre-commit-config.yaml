repos:
  -   repo: https://github.com/pre-commit/mirrors-mypy
      rev: v1.15.0
      hooks:
      -   id: mypy
          args: [ --strict, --ignore-missing-imports ]
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.2
    hooks:
      - id: flake8
default_stages: [pre-commit, pre-push]
default_language_version:
    python: python3.12
