repos:
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: "mypy"
        language: python
        language_version: python3.12
        additional_dependencies: ["mypy==1.15.0"]
        types: [python]
        require_serial: true
        verbose: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: xenon
        name: xenon complexity check
        entry: xenon
        language: python
        additional_dependencies: ["xenon"]
        args:
          [
            "--max-absolute",
            "B",
            "--max-modules",
            "B",
            "--max-average",
            "B",
          ]
        files: \.py$
        exclude: games/
      - id: radon-mi
        name: radon maintainability index
        entry: bash
        language: system
        exclude: multiplayerchess_cog.py
        args:
          [
            "-c",
            'output=$(radon mi --min C --show -e multiplayerchess_cog.py src); if [ -n "$output" ]; then echo "$output"; exit 1; fi',
          ]
        files: \.py$
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
default_stages: [pre-commit, pre-push]
default_language_version:
  python: python3.12
fail_fast: false
